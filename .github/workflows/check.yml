name: Court Notice Checker
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install requests beautifulsoup4
      - name: Run Bot
        run: python bot.py
      - name: Save state
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "update check"
          file_pattern: last.json
